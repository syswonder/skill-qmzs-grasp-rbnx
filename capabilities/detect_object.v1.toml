# VLM 开放词汇检测：自然语言目标 → 像素 + base_link 位姿（只计算，不运动）。
#
# 相机取一帧 RGB → OpenAI 兼容多模态端点返回有向框（归一化）→ 抓取点像素 →
# 手眼标定单应 → base_link XY + 人工 Z + 固定四元数。
# 适合“这个像素/这个物体在哪里”“把红杯子换算成机械臂坐标”这类问题；
# 需要相机原语在线 + VLM 端点配置（config vlm_* 或环境变量 VLM_*）。
[contract]
id          = "robonix/skill/qmzs_grasp/detect_object"
version     = "1"
kind        = "skill"
idl         = "qmzs_grasp/srv/DetectObject.srv"
description = "Detect a named object with a VLM from the camera primitive, convert its grasp point pixel to a base_link pose (calibrated XY + configured/manual Z and fixed quaternion). Computes only; no arm motion."

[mode]
type = "rpc"

[semantics]
user_invocable = true

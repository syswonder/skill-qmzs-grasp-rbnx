# 像素 → 基座位姿 → 直接运动到该位姿。
#
# 与 pixel_to_pose 相同的几何计算，随后把组合好的 Pose 发布到
# arm7aix_controller 原语的 pos_command，等待 end_pose 反馈进入容差后返回。
# 运动前会检查：
#   - 标定模型可用、像素在标定覆盖范围内；
#   - Z 与四元数已配置（或通过参数给出）；
#   - 可选 workspace 边界与单次最大位移（config 里为空则不限制）。
# dry_run=true 时只算不发，便于第一次现场联调。
[contract]
id          = "robonix/skill/arm7aix_grasp/move_to_pixel"
version     = "1"
kind        = "skill"
idl         = "arm7aix_grasp/srv/MoveToPixel.srv"
description = "Compute the base_link pose for a pixel (calibrated XY + configured/manual Z and fixed quaternion) and move the arm to it via the arm primitive pos_command; waits for end_pose feedback and reports reached/timed_out. Blocks until done."

[mode]
type = "rpc"

[semantics]
user_invocable = true
